[package]
name = "fsfi_engine"
version = "0.1.0"
edition = "2021"
description = "FSFI Core Computation Engine - Food System Financing Stress Index (FSFSI) for Rwanda Government"
license = "Proprietary"

[lib]
name = "fsfi_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 - Rust-Python bridge
pyo3 = { version = "0.22", features = ["extension-module"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Cryptography (auth module - Phase 2)
argon2 = "0.5"
jsonwebtoken = "9.3"
aes-gcm = "0.10"
totp-lite = "2.0"
rand = "0.8"
base32 = "0.5"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1.0", features = ["v4"] }

# Encoding
base64 = "0.22"

# Time
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
approx = "0.5"
