[package]
name = "demo_gov_backend"
version = "0.1.0"
edition = "2021"
description = "High-security authentication backend for Demo Government FSFVI platform"
authors = ["FSFI Team"]
default-run = "demo_gov_backend"

[lib]
name = "demo_gov_backend"
path = "src/lib.rs"

[[bin]]
name = "demo_gov_backend"
path = "src/main.rs"

[[bin]]
name = "fix_database"
path = "src/bin/fix_database.rs"

[[bin]]
name = "check_database"
path = "src/bin/check_database.rs"

[[bin]]
name = "add_historical_data"
path = "src/bin/add_historical_data.rs"

[[bin]]
name = "add_peer_data"
path = "src/bin/add_peer_data.rs"

[dependencies]
# Web framework
actix-web = "4.4"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Security
bcrypt = "0.15"
jsonwebtoken = "9.2"
uuid = { version = "1.6", features = ["v4", "serde"] }
argon2 = "0.5"

# Environment and config
dotenv = "0.15"
config = "0.14"

# Database (SQLite for simplicity, can be changed to PostgreSQL)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "macros"] }

# Time and date handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"

# Rate limiting
governor = "0.6"

# Security headers (implemented via custom middleware)
# actix-web has built-in support for custom middleware

# Input validation
validator = { version = "0.18", features = ["derive"] }

# Random number generation
rand = "0.8"

# Futures utilities  
futures-util = "0.3"

# HTTP client (for future integrations)
reqwest = { version = "0.11", features = ["json"] }

# 2FA / TOTP
totp-lite = "1.0.3"
qrcode = "0.13"
base64 = "0.21"
base32 = "0.4"
image = "0.24"
urlencoding = "2.1"

[dev-dependencies]
# Testing framework
tokio-test = "0.4"

# Integration test utilities
serial_test = "3.0"

[[test]]
name = "performance_gap_integration_tests"
path = "tests/performance_gap_integration_tests.rs"
harness = true

[[test]]
name = "assessment_integration_tests"
path = "tests/assessment_integration_tests.rs"
harness = true

[[test]]
name = "budget_optimization_integration_tests"
path = "tests/budget_optimization_integration_tests.rs"
harness = true
