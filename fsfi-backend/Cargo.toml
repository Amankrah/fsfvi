[package]
name = "fsfi-backend"
version = "0.1.0"
edition = "2021"
default-run = "fsfi-backend"

# Library for integration tests and potential reuse
[lib]
name = "fsfi_backend"
path = "src/lib.rs"

# Main server binary
[[bin]]
name = "fsfi-backend"
path = "src/main.rs"

# Utility binary for password hashing
[[bin]]
name = "hash_password"
path = "src/bin/hash_password.rs"

# Utility binary for checking API keys in database
[[bin]]
name = "check_api_key_db"
path = "check_api_key_db.rs"

[dependencies]
# Web Framework
actix-web = "4.5"
actix-cors = "0.7"
actix-rt = "2.9"
actix-service = "2.0"

# Async Runtime
tokio = { version = "1.36", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }

# Authentication & Security
jsonwebtoken = "9.2"
argon2 = "0.5"
uuid = { version = "1.7", features = ["serde", "v4"] }
rand = "0.8"
sha2 = "0.10"
futures-util = "0.3"
base64 = "0.22"
aes-gcm = "0.10"
totp-lite = "2.0"
urlencoding = "2.1"

# Environment & Configuration
dotenv = "0.15"
config = "0.14"

# Logging & Monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"

# Date & Time
chrono = { version = "0.4", features = ["serde"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Rate Limiting
actix-governor = "0.5"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Security Headers
actix-web-httpauth = "0.8"

# API Documentation
utoipa = { version = "4.2", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "6.0", features = ["actix-web"] }

# FSFVI Dependencies
lazy_static = "1.4"  # For static config initialization

[dev-dependencies]
actix-rt = "2.9"
reqwest = { version = "0.11", features = ["json"] }
